*{box-sizing:border-box}
html,body{background:var(--bg2)}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
.ja{font-family:var(--ja)}
.num{font-variant-numeric:tabular-nums}

/* ---------- app shell ---------- */
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){#app{box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(23,26,31,.12)}}
.view{animation:fade .28s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar h1{font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--muted)}
.iconbtn{min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border-radius:12px;padding:0 8px;font-size:13px;font-weight:600;color:var(--ink2)}
.iconbtn:active{background:var(--line2)}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:16px;height:16px}
.icon.lg{width:24px;height:24px}

.pad{padding-inline:16px}
.section{padding:22px 16px 6px;display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.sec-title{font-size:20px;font-weight:800;line-height:1.3}
.sec-sub{font-size:13px;color:var(--muted)}
.more{font-size:13px;font-weight:600;color:var(--primary-ink);min-height:44px;display:inline-flex;align-items:center;gap:2px;white-space:nowrap}

/* ---------- hero ---------- */
.hero{position:relative;height:430px;overflow:hidden;background:#0d1117;color:#fff}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.02)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,14,.55) 0%,rgba(8,10,14,.05) 32%,rgba(8,10,14,.15) 55%,rgba(8,10,14,.86) 100%)}
.hero-in{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 22px}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hero-brand{font-size:11px;font-weight:800;letter-spacing:.24em}
.hero-mode{font-size:11px;font-weight:700;letter-spacing:.08em;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hero-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.hero-title{font-family:var(--serif);font-weight:400;font-size:52px;line-height:.95;letter-spacing:-.01em}
.hero-title i{font-style:italic;color:#9fd2ff}
.hero-sub{font-size:12px;font-weight:700;letter-spacing:.3em;opacity:.85}
.hero-head{font-size:19px;font-weight:700;line-height:1.35;white-space:pre-line;margin-top:6px}
.hero-meta{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:8px}
.hero-date{font-size:13px;opacity:.85}
.dday{font-family:var(--serif);font-size:56px;line-height:.9;color:#fff}
.dday small{font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:.12em;display:block;text-align:right;opacity:.8;margin-bottom:4px}

/* ---------- cards & common ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card-body{padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.bold{font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.divider{height:1px;background:var(--line)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.badges{display:flex;flex-wrap:wrap;gap:5px}
.badge{font-size:11px;font-weight:700;line-height:1;padding:5px 7px;border-radius:7px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.badge.blue{background:var(--primary-soft);color:var(--primary-ink)}
.badge.coral{background:var(--coral-soft);color:var(--coral)}
.badge.mint{background:var(--mint-soft);color:var(--mint)}
.badge.yellow{background:var(--yellow-soft);color:#9a6b00}
.badge.violet{background:var(--kyoto-soft);color:var(--kyoto)}
.badge.dark{background:var(--ink);color:var(--bg)}
:root[data-theme="dark"] .badge.yellow{color:var(--yellow)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.yellow{color:var(--yellow)}}

.btn{min-height:44px;padding:0 14px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;background:var(--line2);color:var(--ink);white-space:nowrap;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.coral{background:var(--coral);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px;border-radius:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns.grid2{display:grid;grid-template-columns:1fr 1fr}
.btns.grid3{display:grid;grid-template-columns:repeat(3,1fr)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px 4px;margin-inline:-16px;scroll-padding-inline:16px}
.chips::-webkit-scrollbar,.carousel::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 16px 8px;margin-inline:-16px;scroll-padding-inline:16px}
.carousel>*{scroll-snap-align:start;flex:none}

.ph{position:relative;background:var(--line2);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;transition:opacity .4s}
.ph img[data-loading]{opacity:0}
.ph .cap{position:absolute;left:8px;bottom:8px;font-size:10px;font-weight:600;color:#fff;background:rgba(0,0,0,.42);padding:3px 6px;border-radius:6px}
.fav{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:#171A1F;z-index:2}
.fav.on{color:var(--coral)}
.fav.on .icon{fill:currentColor}

/* place card (collection) */
.pcard{width:232px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;text-align:left}
.pcard .ph{aspect-ratio:4/3}
.pcard .pb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard h3{font-size:15px;font-weight:700;line-height:1.35}
.pcard .one{font-size:12.5px;color:var(--muted);line-height:1.45}
.rank{position:absolute;left:10px;top:10px;font-family:var(--serif);font-size:30px;line-height:1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4);z-index:1}

/* list card */
.lcard{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);text-align:left;align-items:start}
.lcard .ph{width:96px;height:96px;border-radius:12px}
.lcard h3{font-size:15px;font-weight:700;line-height:1.35}
.lcard .one{font-size:12.5px;color:var(--muted)}
.lcard .acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}

/* ---------- day tabs & timeline ---------- */
.daytabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 16px 0}
.daytab{min-height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.daytab b{font-size:13px;font-weight:800}
.daytab span{font-size:11px;color:var(--muted)}
.daytab.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.daytab.on span{color:var(--bg);opacity:.7}
.daytab.today::after{content:"TODAY";font-size:8.5px;font-weight:800;letter-spacing:.1em;color:var(--coral)}

.daycover{margin:12px 16px 0;border-radius:var(--r-lg);overflow:hidden;position:relative;height:170px;color:#fff}
.daycover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.daycover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.72))}
.daycover .in{position:absolute;inset:auto 0 0 0;padding:16px;z-index:1;display:flex;flex-direction:column;gap:2px}
.daycover .lab{font-size:11px;font-weight:800;letter-spacing:.16em;opacity:.9}
.daycover h2{font-size:22px;font-weight:800}
.daycover p{font-size:13px;opacity:.9}

.timeline{position:relative;padding:14px 16px 0 16px;display:flex;flex-direction:column;gap:12px}
.tl{display:grid;grid-template-columns:52px 1fr;gap:10px;position:relative}
.tl::before{content:"";position:absolute;left:25px;top:26px;bottom:-14px;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl-time{font-size:13px;font-weight:800;padding-top:12px;text-align:center;position:relative;z-index:1}
.tl-time .dot{display:block;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2.5px solid var(--primary);margin:6px auto 0}
.tl.past{opacity:.55}
.tl.now .dot{background:var(--coral);border-color:var(--coral);box-shadow:0 0 0 5px var(--coral-soft)}
.tl-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-align:left;width:100%}
.tl-card .ph{height:140px}
.tl-card .tb{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tl-card h3{font-size:16px;font-weight:800}
.tl-card .one{font-size:13px;color:var(--ink2)}
.tl-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tl-meta span{display:inline-flex;align-items:center;gap:4px}
.tl-simple{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.tl-simple .ic{width:36px;height:36px;border-radius:10px;background:var(--line2);display:flex;align-items:center;justify-content:center;flex:none}
.tl-simple h3{font-size:15px;font-weight:700}
.tl-simple p{font-size:12.5px;color:var(--muted)}
.tl-acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 14px 14px}

/* next up */
.nextup{margin:-36px 16px 0;position:relative;z-index:3;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 10px 40px rgba(23,26,31,.14);padding:16px;display:flex;flex-direction:column;gap:12px}
.nextup .lab{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--coral)}
.nextup h2{font-size:21px;font-weight:800}
.big-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bigact{min-height:74px;border-radius:14px;background:var(--surface2);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;text-align:center;padding:6px 4px;line-height:1.2}
.bigact .icon{width:24px;height:24px}
.bigact.blue{background:var(--primary-soft);color:var(--primary-ink);border-color:transparent}
.bigact.coral{background:var(--coral-soft);color:var(--coral);border-color:transparent}
.bigact.mint{background:var(--mint-soft);color:var(--mint);border-color:transparent}

.tired{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-lg);background:var(--ink);color:var(--bg);text-align:left;width:100%}
.tired b{font-size:16px}
.tired p{font-size:12.5px;opacity:.75}
.tired .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0;color:var(--ink)}

.info{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--yellow-soft);font-size:13px;line-height:1.5;color:var(--ink)}
.info.blue{background:var(--primary-soft)}
.info.coral{background:var(--coral-soft)}
.info.mint{background:var(--mint-soft)}
.info .icon{flex:none;margin-top:1px}

/* flight card */
.flight{padding:16px;display:flex;flex-direction:column;gap:12px}
.fl-route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.fl-code{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.fl-time{font-size:15px;font-weight:700}
.fl-mid{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px}
.fl-line{width:70px;height:1px;background:var(--line);position:relative}

/* ---------- bottom nav ---------- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.tab .icon{width:23px;height:23px}
.tab.on{color:var(--ink)}
.tab.on .icon{stroke-width:2.3}
.fab{position:fixed;z-index:39;right:max(16px,calc(50% - 240px + 16px));bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom,0px));height:52px;padding:0 18px 0 14px;border-radius:99px;background:var(--primary);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 8px 24px rgba(43,150,237,.45)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.45);opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:50%;bottom:0;z-index:61;width:100%;max-width:480px;max-height:90vh;transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);background:var(--bg);border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:translate(-50%,0)}
.sheet-grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:8px auto 2px;flex:none}
.sheet-head{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 16px;flex:none}
.sheet-head h2{font-size:18px;font-weight:800;flex:1}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 20px;display:flex;flex-direction:column;gap:14px}
.sheet .detail-ph{margin:0 -16px;height:220px}

.grid-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gbtn{min-height:84px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;text-align:center;padding:8px 4px;line-height:1.25}
.gbtn .e{font-size:24px;line-height:1}
.gbtn:active{background:var(--line2)}

.sit{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:15px;font-weight:700}
.sit .e{font-size:22px;width:30px;text-align:center}

.plans{display:grid;grid-template-columns:1fr;gap:8px}
.plan{border-radius:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.plan .pl{font-size:10.5px;font-weight:800;letter-spacing:.12em}
.plan p{font-size:13.5px;color:var(--ink2)}
.plan.n .pl{color:var(--primary-ink)} .plan.b .pl{color:var(--coral)} .plan.s .pl{color:var(--muted)} .plan.h .pl{color:var(--mint)}

.walk{display:flex;gap:4px;align-items:center}
.walk i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.walk.LOW i:nth-child(1),.walk.MEDIUM i:nth-child(-n+2),.walk.HIGH i{background:var(--mint)}
.walk.MEDIUM i:nth-child(-n+2){background:var(--yellow)}
.walk.HIGH i{background:var(--coral)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:80;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:12px 16px;border-radius:12px;opacity:0;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- fullscreen phrase ---------- */
.fs{position:fixed;inset:0;z-index:90;background:#FFFFFF;color:#111;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.fs .fs-ja{font-family:var(--ja);font-size:clamp(34px,10vw,54px);font-weight:800;line-height:1.35;margin:auto 0;word-break:normal;overflow-wrap:anywhere}
.fs .fs-ko{font-size:17px;color:#555;font-weight:600}
.fs .fs-ro{font-size:14px;color:#888}
.fs-bar{display:flex;justify-content:space-between;align-items:center}

/* ---------- map ---------- */
.mapwrap{position:relative;margin:0 16px;border-radius:var(--r-lg);overflow:hidden;height:calc(100vh - 250px);min-height:380px;box-shadow:var(--shadow);background:var(--bg2) repeating-linear-gradient(0deg,transparent 0 39px,var(--line) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,var(--line) 39px 40px)}
#map{position:absolute;inset:0;background:transparent}
.leaflet-container{font-family:var(--font);background:transparent}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);color:#fff;font-size:11px;font-weight:800}
.mapcard{position:absolute;left:10px;right:10px;bottom:10px;z-index:500;background:var(--surface);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:grid;grid-template-columns:84px 1fr;gap:12px;padding:10px}
.mapcard .ph{width:84px;height:84px;border-radius:12px}
.map-note{position:absolute;top:10px;left:10px;right:56px;z-index:500;font-size:12px;background:var(--surface);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow);color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .chip i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* ---------- tools grid ---------- */
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tool{min-height:96px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left}
.tool .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.tool b{font-size:15px}
.tool p{font-size:12px;color:var(--muted)}

/* phrase list */
.phrase{display:flex;align-items:center;gap:10px;padding:14px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);text-align:left;width:100%}
.phrase .ko{font-size:13px;color:var(--muted)}
.phrase .jp{font-family:var(--ja);font-size:18px;font-weight:700;line-height:1.4}
.phrase .ro{font-size:12px;color:var(--muted)}

/* budget */
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.bar i.over{background:var(--coral)}
.bline{display:grid;grid-template-columns:1fr 110px;gap:8px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.bline:last-child{border-bottom:0}
input.in{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;font:inherit;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
input.in:focus{outline:2px solid var(--primary);outline-offset:0;border-color:transparent}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:600}
.toggle input{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:99px;position:relative;transition:background .2s;cursor:pointer}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked{background:var(--primary)}
.toggle input:checked::after{transform:translateX(18px)}

/* checklist */
.check{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 14px;border-bottom:1px solid var(--line2);font-size:14.5px;cursor:pointer}
.check:last-child{border-bottom:0}
.check input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:all .15s;cursor:pointer}
.check input:checked{background:var(--mint);border-color:var(--mint)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:checked+span{color:var(--muted);text-decoration:line-through}

.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--mint) calc(var(--p)*1%),var(--line2) 0);display:grid;place-items:center;flex:none}

.emerg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emerg .big{border-radius:var(--r);padding:16px;background:var(--coral);color:#fff;display:flex;flex-direction:column;gap:2px}
.emerg .big b{font-size:40px;line-height:1;font-weight:800;letter-spacing:-.02em}

.skeleton{background:linear-gradient(90deg,var(--line2) 25%,var(--surface2) 37%,var(--line2) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:12px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

.wx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wx .c{padding:14px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.wx .t{font-size:26px;font-weight:800;letter-spacing:-.02em}

.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair{border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}

.pair .imgs .ph{height:92px}
.pair p{padding:10px 12px;font-size:13px;font-weight:700;text-align:center}

.accordion{border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.accordion summary{list-style:none;min-height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;cursor:pointer}
.accordion summary::-webkit-details-marker{display:none}
.accordion[open] summary .icon{transform:rotate(180deg)}
.accordion .acc-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--ink2)}

.dday{white-space:nowrap}

/* =================== v3 · 쨍한 컬러 · 귀여운 아이콘 =================== */
:root{
  --bg:#FFF9F4; --bg2:#FFF3EA; --surface:#FFFFFF; --surface2:#FFF6EF;
  --ink:#16121F; --ink2:#3E3650; --muted:#8A8199; --line:#F0E6DE; --line2:#F6EEE7;
  --primary:#2563FF; --primary-ink:#1A4FE0; --primary-soft:#E8EEFF;
  --coral:#FF2E63; --coral-soft:#FFE9EF; --mint:#00B98A; --mint-soft:#E0FAF1; --yellow:#FFC800; --yellow-soft:#FFF6CC;
  --kyoto:#7C3AED; --kyoto-soft:#F1EAFF; --orange:#FF7A00;
  --shadow:0 2px 4px rgba(22,18,31,.04),0 10px 28px rgba(255,90,60,.08);
  --r-lg:24px; --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120F18; --bg2:#0C0A10; --surface:#1D1926; --surface2:#241F2E; --ink:#FBF7FF; --ink2:#D9D1E6; --muted:#9C92AD; --line:#2F2940; --line2:#282236;
  --primary:#5B8CFF; --primary-ink:#9DB8FF; --primary-soft:#1A2450; --coral:#FF5C86; --coral-soft:#3D1624; --mint:#2EE0AE; --mint-soft:#0F3328; --yellow:#FFD84D; --yellow-soft:#3A3010; --kyoto:#A98BFF; --kyoto-soft:#2A1F4A;
  --shadow:0 2px 4px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{--bg:#120F18; --bg2:#0C0A10; --surface:#1D1926; --surface2:#241F2E; --ink:#FBF7FF; --ink2:#D9D1E6; --muted:#9C92AD; --line:#2F2940; --line2:#282236;
  --primary:#5B8CFF; --primary-ink:#9DB8FF; --primary-soft:#1A2450; --coral:#FF5C86; --coral-soft:#3D1624; --mint:#2EE0AE; --mint-soft:#0F3328; --yellow:#FFD84D; --yellow-soft:#3A3010; --kyoto:#A98BFF; --kyoto-soft:#2A1F4A;}
.sec-title,.topbar h1{letter-spacing:-.03em;font-weight:900}
.btn{border-radius:14px}
.btn.primary{background:linear-gradient(135deg,#2563FF,#7C3AED);box-shadow:0 6px 16px rgba(37,99,255,.28)}
.chip.on{background:linear-gradient(135deg,#FF2E63,#FF7A00);border-color:transparent;color:#fff}
.daytab{border:0;box-shadow:var(--shadow)}
.daytab.on{background:linear-gradient(135deg,#FF2E63,#FF7A00);color:#fff}
.fab{background:linear-gradient(135deg,#FF2E63,#FF7A00);box-shadow:0 10px 24px rgba(255,46,99,.4)}
/* tab bar */
.tab .te{font-size:22px;line-height:1;filter:grayscale(.85) opacity(.65);transition:transform .15s,filter .15s}
.tab.on .te{filter:none;transform:translateY(-2px) scale(1.12)}
.tab.on{color:var(--coral)}
.tab.on span:last-child{font-weight:900}
/* hero carousel */
.hc{position:relative;height:460px;background:#16121F;overflow:hidden}
.hc-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hc-track::-webkit-scrollbar{display:none}
.hc-slide{flex:0 0 100%;height:100%;position:relative;scroll-snap-align:start;color:#fff;display:block}
.hc-slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hc-slide::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0,rgba(0,0,0,0) 30%,rgba(0,0,0,.1) 55%,rgba(10,6,20,.85) 100%)}
.hc-in{position:absolute;left:20px;right:20px;bottom:56px;z-index:1;display:flex;flex-direction:column;gap:6px}
.hc-tag{align-self:flex-start;font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;background:#FFC800;color:#16121F}
.hc-in h2{font-size:34px;line-height:1.12;font-weight:900;letter-spacing:-.04em;white-space:pre-line;text-shadow:0 2px 16px rgba(0,0,0,.35)}
.hc-in p{font-size:14px;font-weight:600;opacity:.92;margin:0}
.hc-top{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;pointer-events:none}
.hc-brand{color:#fff;font-weight:900;font-size:15px;letter-spacing:-.02em;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.hc-brand i{font-style:normal;font-weight:500;font-size:11px;letter-spacing:.2em;opacity:.8;margin-left:6px}
.hc-sticker{background:linear-gradient(135deg,#FF2E63,#FF7A00);color:#fff;font-weight:900;font-size:20px;padding:8px 14px;border-radius:16px;transform:rotate(4deg);box-shadow:0 8px 20px rgba(255,46,99,.45)}
.hc-dots{position:absolute;bottom:36px;left:20px;z-index:2;display:flex;gap:6px}
.hc-dots i{width:7px;height:7px;border-radius:9px;background:rgba(255,255,255,.5);transition:width .2s}
.hc-dots i.on{width:22px;background:#fff}
.viewtabs{margin-top:-22px;position:relative;z-index:3;background:var(--surface);box-shadow:var(--shadow)}
.vt.on{background:linear-gradient(135deg,#16121F,#3E3650);color:#fff}
.vt.on small{color:#FFC800}
/* quick menu */
.qm{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 4px}
.qi{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.qe{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:26px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.05);transition:transform .15s}
.qi:active .qe{transform:scale(.92) rotate(-4deg)}
.qi b{font-size:12px;font-weight:800;color:var(--ink2);line-height:1.2}
.gh{font-size:17px;font-weight:900;letter-spacing:-.02em;margin:0}
/* anchor bar */
.anc{position:sticky;top:0;z-index:25;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.anc::-webkit-scrollbar{display:none}
.anc button{flex:none;font-size:13px;font-weight:800;padding:8px 14px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink2)}
.anc button:active{background:var(--ink);color:var(--bg)}
.anchor-t{scroll-margin-top:64px}
/* section heads */
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.sh-e{font-size:12px;font-weight:800;color:var(--coral)}
.sh h2{font-size:22px;font-weight:900;letter-spacing:-.04em;line-height:1.2;margin:2px 0 0}
/* stickers */
.stk{position:absolute;left:10px;top:10px;z-index:1;font-size:11px;font-weight:900;padding:5px 9px;border-radius:10px;background:#FFC800;color:#16121F;transform:rotate(-4deg);box-shadow:0 4px 10px rgba(0,0,0,.18)}
.dayb{display:inline-block;font-size:11px;font-weight:800;padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.92);color:#16121F}
/* spot card (carousel) */
.sp{width:210px;border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.sp-ph{position:relative;aspect-ratio:4/5;background:#ddd}
.sp-ph img{width:100%;height:100%;object-fit:cover}
.sp-ph .dayb{position:absolute;right:10px;top:10px}
.sp-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}

.ds-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.ds-b b{font-size:17px;font-weight:900;letter-spacing:-.03em}
.ds-b p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.45}
.ds-m{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.pr{font-weight:900;color:var(--coral);font-size:13px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dgrid .ds{width:auto}
.dgrid .ds-b b{font-size:15.5px}
/* near card */
.nc{width:240px;border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}

.nc-ph img{width:100%;height:100%;object-fit:cover}
.nt{position:absolute;left:10px;top:10px;font-size:12px;font-weight:900;padding:5px 9px;border-radius:10px;background:#fff;color:#16121F}
.nt2{font-size:12px;font-weight:900;padding:4px 9px;border-radius:10px;background:var(--mint-soft);color:var(--mint)}
.nc-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.nc-b b{font-size:15px;font-weight:900;letter-spacing:-.02em}.nc-b .ja{font-size:11px;color:var(--muted)}

.nc-m{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11.5px;color:var(--muted);font-weight:600}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:99px;background:var(--line2);align-self:flex-start}
.seg button{padding:7px 16px;border-radius:99px;font-size:13px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
/* page banner */
.pbanner{margin:6px 16px 4px;padding:22px 20px;border-radius:26px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));position:relative;overflow:hidden}

.pbanner span{font-size:11px;font-weight:900;letter-spacing:.2em;opacity:.85}
.pbanner h2{font-size:26px;font-weight:900;letter-spacing:-.04em;margin:4px 0 2px;line-height:1.2}
.pbanner p{margin:0;font-size:13px;opacity:.9}
/* landmark big card */
.lm{border-radius:26px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.lm-ph{position:relative;aspect-ratio:4/5;max-height:520px;width:100%}
.lm-ph img{width:100%;height:100%;object-fit:cover}

.lm-t{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;color:#fff;display:flex;flex-direction:column;gap:4px}
.lm-t h3{font-size:28px;font-weight:900;letter-spacing:-.04em;line-height:1.15;margin:0}
.lm-t small{font-size:12px;opacity:.8}
.lm-t .dayb{align-self:flex-start}
.lm-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.lm-i{margin:0;font-size:15px;line-height:1.6;color:var(--ink2);font-weight:500}
.lm-rows{display:flex;flex-direction:column;gap:0;border-radius:16px;background:var(--surface2);padding:4px 14px}
.lm-rows div{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.lm-rows div:last-child{border-bottom:0}
.lm-rows span{color:var(--muted);font-weight:700}.lm-rows b{font-weight:700}

.kch.Eleven{background:#F26B1D}.kch.FamilyMart{background:#00A04A}.kch.Lawson{background:#0079C2}
.kc-m{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:auto}
.tg{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:7px;background:var(--yellow-soft);color:#8a6500}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kgrid .kc{width:auto}
/* misc refresh */
.card{border-radius:22px}
.tl-card,.tl-simple{border-radius:20px}
.info{border-radius:18px}

/* ---------------- time / trip mode ---------------- */
function jstNow() {
  const d = new Date();
  const f = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
  const p = Object.fromEntries(f.formatToParts(d).map((x) => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, min: (+p.hour % 24) * 60 + +p.minute };
}
const dayDiff = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
function tripState() {
  const ov = store.get('mode', 'auto');
  let now = jstNow();
  if (ov.startsWith('day')) { const n = +ov.slice(3); now = { date: ITINERARY[n - 1].date, min: now.min }; }
  else if (ov === 'pre') now = { date: '2026-09-27', min: now.min };
  else if (ov === 'post') now = { date: '2026-10-20', min: now.min };
  const d = dayDiff(now.date, TRIP_CONFIG.start);
  const e = dayDiff(now.date, TRIP_CONFIG.end);
  if (d > 0) return { mode: 'pre', dday: d, now, override: ov };
  if (e < 0) return { mode: 'post', now, override: ov };
  const day = -d + 1;
  return { mode: 'during', day, now, override: ov };
}
const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };

const DAY_COLORS = { 1: '#8A93A3', 2: '#2563FF', 3: '#7C3AED', 4: '#FF7A00' };
function dayPoints(d) {
  const pts = [];
  const hotel = { name: '숙소', lat: HOTEL_DATA.lat, lng: HOTEL_DATA.lng, home: true };
  const kix = P('pickup');
  d.items.forEach((it) => {
    let p = null;
    if (it.type === 'place' && P(it.ref)) { const x = P(it.ref); if (x.id === 'pickup') p = { name: d.day === 4 ? '하이에이스 출발' : '간사이공항', lat: d.day === 4 ? null : x.lat, lng: d.day === 4 ? null : x.lng }; else p = { name: x.nameKo.replace(/\s*\(.*?\)/g, ''), lat: x.lat, lng: x.lng, t: it.t }; }
    else if (it.ref && Rst(it.ref)) { const r = Rst(it.ref); p = { name: r.nameKo.replace(/\s*\(.*?\)/g, ''), lat: r.latitude, lng: r.longitude, t: it.t, meal: true }; }
    else if (it.ref && Caf(it.ref)) { const c = Caf(it.ref); p = { name: c.nameKo, lat: c.lat, lng: c.lng, t: it.t, meal: true }; }
    else if (it.ref === 'hotel' || it.ref === 'konbini') p = Object.assign({ t: it.t }, hotel);
    else if (it.type === 'flight' && kix) p = { name: '간사이공항', lat: kix.lat, lng: kix.lng, t: it.t };
    if (!p || !p.lat) return;
    const last = pts[pts.length - 1];
    if (last && Math.abs(last.lat - p.lat) < 0.0005 && Math.abs(last.lng - p.lng) < 0.0005) return;
    pts.push(p);
  });
  if (d.day === 4 && kix) pts.push({ name: '간사이공항', lat: kix.lat, lng: kix.lng });
  return pts;
}
function dayRouteUrl(d) {
  const pts = dayPoints(d); if (pts.length < 2) return gm.hotelDir();
  const ll = (p) => `${p.lat},${p.lng}`;
  const mid = pts.slice(1, -1).slice(0, 8).map(ll).join('|');
  return `https://www.google.com/maps/dir/?api=1&origin=${ll(pts[0])}&destination=${ll(pts[pts.length - 1])}${mid ? '&waypoints=' + encodeURIComponent(mid) : ''}&travelmode=transit`;
}
function svgRoute(pts, col) {
  const W = 340, H = 280, pad = 30;
  const la = pts.map((p) => p.lat), ln = pts.map((p) => p.lng);
  const minA = Math.min(...la), maxA = Math.max(...la), minN = Math.min(...ln), maxN = Math.max(...ln);
  const sx = (W - pad * 2) / Math.max(maxN - minN, 0.002), sy = (H - pad * 2) / Math.max(maxA - minA, 0.002), sc = Math.min(sx, sy);
  const ox = (W - (maxN - minN) * sc) / 2, oy = (H - (maxA - minA) * sc) / 2;
  const xy = (p) => [ox + (p.lng - minN) * sc, H - (oy + (p.lat - minA) * sc)];
  const line = pts.map((p) => xy(p).map((v) => v.toFixed(1)).join(',')).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><polyline points="${line}" fill="none" stroke="${col}" stroke-width="4" stroke-dasharray="8 7" stroke-linecap="round"/>${pts.map((p, i) => { const [x, y] = xy(p); return `<g><circle cx="${x}" cy="${y}" r="13" fill="${p.home ? '#16121F' : col}" stroke="#fff" stroke-width="3"/><text x="${x}" y="${y + 4.5}" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">${p.home ? 'H' : i + 1}</text></g>`; }).join('')}</svg>`;
}
let dayMap = null;
function initDayMap(dayN) {
  const el = document.getElementById('daymap'); if (!el) return;
  const d = ITINERARY[dayN - 1]; const pts = dayPoints(d);
  const col = DAY_COLORS[dayN];
  const lg = document.getElementById('daylegend');
  if (lg) lg.innerHTML = pts.map((p, i) => `<span><i style="background:${p.home ? '#16121F' : col}">${p.home ? '🏠' : i + 1}</i>${esc(p.name)}</span>`).join('');
  if (dayMap) { try { dayMap.remove(); } catch (e) {} dayMap = null; }
  if (!pts.length) { el.hidden = true; return; }
  if (!window.L) { el.innerHTML = svgRoute(pts, col); return; }
  dayMap = L.map(el, { zoomControl: false, attributionControl: false, scrollWheelZoom: false, tap: false });
  L.control.zoom({ position: 'topright' }).addTo(dayMap);
  const tl = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, subdomains: 'abc' }).addTo(dayMap);
  let errs = 0; tl.on('tileerror', () => { if (++errs === 3) el.classList.add('notiles'); });
  L.polyline(pts.map((p) => [p.lat, p.lng]), { color: col, weight: 4, opacity: .85, dashArray: '8 8' }).addTo(dayMap);
  pts.forEach((p, i) => {
    const html = `<div class="dpin" style="background:${p.home ? '#16121F' : col}">${p.home ? '🏠' : i + 1}</div>`;
    L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html, iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(dayMap).bindTooltip(`${p.t ? p.t + ' ' : ''}${p.name}`, { direction: 'top', offset: [0, -14] });
  });
  const fit = () => { if (!dayMap) return; dayMap.invalidateSize(); dayMap.fitBounds(L.latLngBounds(pts.map((p) => [p.lat, p.lng])), { padding: [28, 28], maxZoom: 15 }); };
  fit(); [200, 700].forEach((t) => setTimeout(fit, t));
}

/* ---------------- weather (Open-Meteo, 무료 · 키 없음) ---------------- */
const WMO = (c) => c === 0 ? ['맑음', 'sun'] : c <= 3 ? ['구름', 'sun'] : c <= 48 ? ['안개', 'sun'] : c <= 67 || (c >= 80 && c <= 82) ? ['비', 'rain'] : c <= 77 ? ['눈', 'rain'] : ['뇌우', 'rain'];
async function fetchWeather() {
  const cached = (() => { try { return JSON.parse(sessionStorage.getItem('jt.wx')); } catch (e) { return null; } })();
  if (cached && Date.now() - cached.t < 3 * 3600e3) return cached.d;
  const res = await Promise.all(WEATHER_POINTS.map((w) => fetch(`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16`).then((r) => { if (!r.ok) throw new Error('wx'); return r.json(); })));
  const d = res.map((r, i) => ({ city: WEATHER_POINTS[i].city, daily: r.daily }));
  try { sessionStorage.setItem('jt.wx', JSON.stringify({ t: Date.now(), d })); } catch (e) {}
  return d;
}

        <div class="wx" style="margin-top:8px">${data.map((c) => { const i = c.daily.time.indexOf(date); const [w, icn] = WMO(c.daily.weather_code[i]); const pr = c.daily.precipitation_probability_max[i]; if (pr >= 50) rainy = true;
          return `<div class="c" style="box-shadow:none;background:var(--surface2)"><span class="eyebrow">${c.city === 'OSAKA' ? '오사카' : '교토'}</span><span class="row">${ic(icn)}<b class="num">${Math.round(c.daily.temperature_2m_max[i])}° / ${Math.round(c.daily.temperature_2m_min[i])}°</b></span><span class="xs muted num">${w} · 강수 ${pr ?? '-'}%</span></div>`; }).join('')}</div></div>`;
    }).join('');

    pts.push({ layer, kind: 'place', id: p.id, title: p.nameKo, img: p.img, q: p.q, lat: p.lat, lng: p.lng, sched });

}

  return `<a class="kc" href="${esc(k.url)}" target="_blank" rel="noopener"><span class="kch ${k.chain.replace(/[^a-z]/gi, '')}">${CHAIN_KO[k.chain] || k.chain}</span><b>${esc(k.ko)}</b><small class="ja">${esc(k.ja)}</small><div class="kc-m"><span class="pr">${yenStr(k.price)}</span>${tags.map((t) => `<span class="tg">${esc(t)}</span>`).join('')}</div></a>`;
}

    <b>${esc(c.name)}</b><small>${esc(c.where)}</small><p>${esc(c.tip)}</p><div class="cc-m"><span>🕘 ${esc(c.hours)}</span><span>🚉 ${esc(c.station)}</span>${c.price ? `<span>💴 ${esc(c.price)}</span>` : ''}</div></a>`;
}
function sweetCard(s) {
  const ph = s.img && PHOTO[s.img] ? `<img src="${img(s.img)}" alt="" loading="lazy">` : `<span class="emo">${s.e}</span>`;
  return `<a class="ds au" href="${gm.search(s.q)}" target="_blank" rel="noopener"><div class="ds-ph ${s.img ? '' : 'noimg'}">${ph}<span class="stk">가을 한정</span></div>
    <div class="ds-b"><b>${esc(s.name)}</b><p>${esc(s.note)}</p><div class="ds-m"><span>📍 ${esc(s.shop)}</span><span>${s.day}일차 · ${esc(s.where)}</span></div></div></a>`;
}

  <div class="pad"><div class="chips">${['전체', '포켓몬', '짱구', '산리오', '멀티'].map((c) => `<button class="chip ${f === c ? 'on' : ''}" data-charaf="${c}">${{ 전체: '✨', 포켓몬: '⚡', 짱구: '🍑', 산리오: '🎀', 멀티: '🧸' }[c]} ${c}</button>`).join('')}</div></div>
  <div class="section"><div class="stack-sm">${list.map((c) => charaCard(c)).join('')}</div>
  <div class="card"><div class="card-body"><div class="eyebrow">🗺️ 캐릭터 동선</div>

    <div class="giftrow"><b>2일차 우메다 (16:40–17:50)</b><small>포켓몬센터 오사카(LUCUA SOUTH 13층) → HEP FIVE 4층 짱구·산리오 → (선택) 키디랜드</small></div>
    <div class="giftrow"><b>3일차 아라시야마</b><small>스누피 차야 · 리락쿠마 사보 · 미피 키친 (자유시간에 구경만)</small></div>
    <div class="giftrow"><b>4일차 난바</b><small>산리오 기프트게이트 에비스바시점 (11:30 오픈)</small></div></div></div>
  <p class="xs muted">${esc(CHARA_NOTE)}</p></div>${footer()}`;
};
PAGES.autumn = () => `${topbar('가을 교토·오사카')}<div class="pbanner autumn" style="--c1:#C2410C;--c2:#F59E0B"><span>AUTUMN 2026 · 秋</span><h2>밤·고구마·말차의 계절</h2><p>10월 중순, 우리 동선에서 만나는 가을</p><i class="aki">秋</i></div>
  <div class="section"><div class="info yellow">🍁<div>${esc(AUTUMN.koyo)}</div></div>
  ${secHead('🌰 가을 한정', '지금만 먹을 수 있는 디저트')}<div class="dgrid">${AUTUMN.sweets.map(sweetCard).join('')}</div>
  ${secHead('✨ 이색 체험', '우리 가족만의 추억')}<div class="stack-sm">${AUTUMN.unique.map((u) => `<a class="uq" href="${gm.search(u.q)}" target="_blank" rel="noopener"><span class="ue">${u.e}</span><div><b>${esc(u.name)} <span class="dayb">${u.day}일차</span></b><p>${esc(u.note)}</p></div></a>`).join('')}</div>
  <p class="xs muted">가격·운영은 2026-09-28 기준이에요. “확인 필요”는 가게 공식 확인이 안 된 정보예요.</p></div>${footer()}`;
PAGE_TAB.chara = 'home'; PAGE_TAB.autumn = 'home';

/* ================================================================
   events (delegation)
   ================================================================ */
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button, a, label, [data-open]'); if (!t) return;
  const d = t.dataset;
  if (d.fav) { ev.preventDefault(); ev.stopPropagation(); toggleFav(d.fav); return; }
  if (d.favbtn) { ev.preventDefault(); toggleFav(d.favbtn); return; }
  if (d.open) { ev.preventDefault(); const [k, id] = d.open.split(':'); openDetail(k, id); return; }
  if (d.back !== undefined) { if (history.length > 1) history.back(); else location.hash = '#home'; return; }
  if (d.close !== undefined) { closeSheet(); return; }
  if (d.day) { selDay = +d.day; $$('.daytab').forEach((b) => b.classList.toggle('on', +b.dataset.day === selDay)); $('#tl').innerHTML = timelineHTML(selDay, tripState()); lazyFix(); initDayMap(selDay); return; }
  if (d.go) {
    ev.preventDefault();
    const g = d.go;
    if (g === 'hotel') { closeSheet(true); location.hash = '#hotel'; return; }
    if (g === 'taxi') { openTaxi(); return; }
    if (g === 'taxicard') { openFS(HOTEL_DATA.taxiCard, '숙소로 가 주세요'); return; }
    if (g === 'skip') { openSheet('다음 일정 SKIP', `<p class="small">다음 일정 카드를 열면 <b>SKIP</b>과 <b>BACK TO HOTEL</b> 옵션이 있어요.</p><a class="btn primary block" href="#home">오늘 일정 열기</a>`); return; }
    if (g === 'phrase-hospital') { store.set('phcat', 'hospital'); closeSheet(true); location.hash = '#phrases'; return; }
    if (g === 'phrase-late') { openFS('少し遅れます。予約した○○です。', '조금 늦어요. 예약한 ○○입니다.', 'Sukoshi okuremasu.'); return; }
    if (g === 'today') { closeSheet(true); location.hash = '#home'; return; }
    closeSheet(true); location.hash = '#' + g; return;
  }
  if (d.anchor) { ev.preventDefault(); const el = document.getElementById(d.anchor); if (el) { const y = el.getBoundingClientRect().top + window.scrollY - 64; window.scrollTo({ top: y, behavior: 'smooth' }); } return; }
  if (d.hday) { ev.preventDefault(); selDay = +d.hday; route(); setTimeout(() => { const el = document.getElementById('sec-itin'); el && window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 64, behavior: 'smooth' }); }, 60); return; }
  if (d.spot) { ev.preventDefault(); const sp = SPOTS.find((x) => x.id === d.spot); if (P(d.spot)) openDetail('place', d.spot); else if (sp) { location.hash = '#spots'; } return; }
  if (d.neart) { store.set('nearT', d.neart); $$('[data-neart]').forEach((b) => b.classList.toggle('on', b.dataset.neart === d.neart)); const nl = $('#nearList'); if (nl) { nl.innerHTML = NEARBY.filter((n) => n.type === d.neart).map(nearCard).join(''); nl.scrollLeft = 0; } return; }
  if (d.neart2) { store.set('nearT2', d.neart2); route(); return; }
  if (d.spotf) { spotF = d.spotf; route(); return; }
  if (d.charaf) { store.set('charaF', d.charaf); route(); return; }
  if (d.view) { store.set('view', d.view); route(); return; }
  if (d.viewGo) { store.set('view', d.viewGo); location.hash = '#home'; route(); return; }
  if (d.ezday) { selDay = +d.ezday; route(); return; }
  if (d.sit) { openSituation(d.sit); return; }
  if (d.must) { openMust(d.must); return; }
  if (d.speak) { speak(d.speak); return; }
  if (d.copy) { copyText(d.copy); return; }
  if (d.phgo) store.set('phcat', d.phgo);
  if (d.act) {
    const a = d.act;
    if (a === 'planb') openPlanB();
    else if (a === 'quick') openQuickFind();
    else if (a === 'taxi') openTaxi(d.q);
    else if (a === 'fs') openFS(d.ja, d.ko, d.ro);
    else if (a === 'rainplan') openSituation('rain');
    else if (a === 'share') { const [k, id] = d.k.split(':'); shareEntity(entity(k, id)); }
    else if (a === 'resetcheck') { store.set('check', {}); store.set('resv', {}); route(); toast('모두 해제했어요'); }
    return;
  }
  if (d.foodf) { foodF = d.foodf; route(); return; }
  if (d.cafef) { cafeF = d.cafef; if (current === 'cafes') route(); else { const wrap = t.closest('.section'); wrap.outerHTML = cafesSection(foodF === 'Cafe'); lazyFix(); } return; }
  if (d.shopf) { shopF = d.shopf; route(); return; }
  if (d.souvf) { souvF = d.souvf; route(); return; }
  if (d.bestc) { bestCat = d.bestc; route(); return; }
  if (d.phcat) { store.set('phcat', d.phcat); route(); return; }
  if (d.mode) { store.set('mode', d.mode); selDay = null; toast('화면 모드를 바꿨어요'); route(); return; }
  if (d.mapf) { mapFilter = d.mapf; store.set('mapf2', mapFilter); $$('[data-mapf]').forEach((b) => b.classList.toggle('on', b.dataset.mapf === mapFilter)); applyMapFilter(true); return; }
  if (d.mapgo) {
    const g = d.mapgo; if (!mapObj) return;
    if (g === 'osaka') mapObj.setView([34.672, 135.505], 13);
    if (g === 'kyoto') mapObj.fitBounds([[34.96, 135.60], [35.03, 135.79]], { padding: [20, 20] });
    if (g === 'hotel') { mapObj.setView([HOTEL_DATA.lat, HOTEL_DATA.lng], 15); mapCard({ kind: 'hotel', id: 'hotel', title: '우리 숙소', img: 'tanimachi-line', q: HOTEL_DATA.addressJa, sched: HOTEL_DATA.addressJa }); }
    if (g === 'me') locate((ok) => { if (ok) { mapObj.setView([GEO.lat, GEO.lng], 15); L.circleMarker([GEO.lat, GEO.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#2B96ED', fillOpacity: 1 }).addTo(mapObj); } else toast('위치 권한이 없어 현재 위치를 표시할 수 없어요'); });
    return;
  }
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.dataset.chk) { const d = store.get('check', {}); d[t.dataset.chk] = t.checked; store.set('check', d); }
  if (t.dataset.resv) { const d = store.get('resv', {}); d[t.dataset.resv] = t.checked; store.set('resv', d); }
});
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-open]')) { e.preventDefault(); e.target.click(); return; } if (e.key === 'Escape') { const f = $('#fs'); if (f) f.remove(); else closeSheet(); } });
window.addEventListener('scroll', () => { const tb = $('.topbar'); tb && tb.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
window.addEventListener('hashchange', route);

/* ---------------- boot ---------------- */
function boot() {
  $('#tabbar').innerHTML = TABS.map((t) => `<a class="tab" data-tab="${t.key}" href="#${t.key}"><span class="te">${t.e}</span><span>${t.label}</span></a>`).join('');
  $('#fab').innerHTML = `${ic('pin')}주변`;
  $('#fab').addEventListener('click', openQuickFind);
  route();
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
}
boot();
})();

</script>
